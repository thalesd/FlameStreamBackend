# Traefik dynamic configuration (file provider).
#
# Serves the Let's Encrypt certificate that Posh-ACME already renews on the Windows side, mounted
# read-only at /certs. This keeps the whole stack working today with no ACME account, no GoDaddy
# API credentials and no new certificate issued.
#
# ON THE LINUX SERVER, swap to Traefik doing ACME itself: uncomment the certificatesresolvers
# flags in docker-compose.yml, add the GoDaddy creds to .env, put
# `traefik.http.routers.<name>.tls.certresolver=le` on the routers, and delete this file plus its
# mount. That's the version that renews unattended — this one inherits whatever Windows renews.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/fullchain.cer
        keyFile: /certs/cert.key
