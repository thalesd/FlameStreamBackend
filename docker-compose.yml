# Runs the backend under Docker inside the WSL2 Ubuntu-24.04 distro (Docker Engine lives in the
# distro, not Docker Desktop), so all host paths below are WSL paths:
#
#   wsl -d Ubuntu-24.04
#   cd /mnt/c/Users/Thales/source/repos/Saga/SagaBackend
#   docker compose up --build                 # backend only, plain HTTP on :5000
#   docker compose --profile tls up --build   # + the Angular frontend, served over HTTPS
#
# ── ON TLS: THE PROXY MOVED OUT ──────────────────────────────────────────────────────────────
# The Traefik that terminates TLS used to be a service in this file, named `bifrost`. It now
# lives in its own repository — ../../Bifrost — because the ingress for the whole homelab has no
# business belonging to the media server: exposing anything else over HTTPS meant editing this
# file or fighting a second Traefik for ports 80/443.
#
# What stayed here are the LABELS. A route describes the service it points at, so it belongs
# next to that service. Traefik reads them through the shared `bifrost` network below.
#
#   cd /mnt/c/Users/Thales/source/repos/Bifrost && docker compose up -d
#
# The backend image still speaks plain HTTP and knows nothing about certificates, deliberately.
# Kestrel reads a cert exactly once when it binds HTTPS, so a renewal inside the app container
# wouldn't take effect until a restart; more than one replica would race Let's Encrypt into its
# rate limits; and the DNS API secret has no business being in the app image. TLS is always
# somebody else's job — which also means this identical image drops into k8s untouched, with
# cert-manager + an Ingress doing what the bridge does here.
#
# The commented Kestrel__ block on the backend is the other option: no proxy, a cert Kestrel
# serves directly. It is what the native Windows run used, and it goes away with the Posh-ACME
# script in phase 7b.
#
# ── THE `bifrost` NETWORK IS EXTERNAL, AND MUST EXIST FIRST ──────────────────────────────────
#   docker network create bifrost
#
# Once, and only once — it outlives every stack that hangs off it. `docker compose up` fails
# with "network bifrost declared as external, but could not be found" if it is missing.

services:
  backend:
    build:
      context: .
    image: saga-backend
    container_name: saga-backend
    restart: unless-stopped

    ports:
      - "5000:5000"       # plain HTTP, handy for local debugging
      # HTTPS on the same port the native Windows backend uses, so the frontend, the Cast
      # receiver URL registered at cast.google.com and the TV all keep working unchanged.
      - "5001:5001"

    volumes:
      # Read-only on purpose: the app never writes into LibraryRoot. Everything it derives
      # (HLS segments, scene thumbs, extracted .vtt, mediainfo.json, the SQLite DBs) lands in
      # CacheRoot, which keeps an accidental transcode from ever touching the library.
      - /mnt/d/Saga/Media:/media:ro

      # Shared with the Windows run so watch history, My List and already-transcoded titles
      # carry straight over. DON'T run the Windows backend and this container at the same time —
      # two processes writing watchhistory.db/mylist.db over the same 9p mount will corrupt or
      # lock them. If you'd rather isolate the container (and get much faster segment writes on
      # ext4 instead of /mnt/d), swap this line for the named volume at the bottom of the file:
      #   - saga-cache:/cache
      - /mnt/d/Saga/Cache:/cache

      # Native-app update artifacts served at /api/app/**; published from Windows, so read-only.
      - ./AppReleases:/app-releases:ro

      # The Let's Encrypt cert, still renewed by Posh-ACME on the Windows side. Read-only.
      # Drop this (and the Kestrel__ vars) the day Traefik takes over TLS.
      - /mnt/c/Users/Thales/AppData/Local/Posh-ACME/LE_PROD/3275644921/saga.tdonsoft.com:/certs:ro

    # Linux server only — hands the GPU render node to the container so VAAPI encode works.
    # Inert in WSL2: /dev/dri does not exist there, only /dev/dxg. Pair with
    # Server__Hls__HardwareAcceleration=Vaapi below, and group_add for the render group.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render

    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - Kestrel__Endpoints__Https__Url=https://0.0.0.0:5001
      - Kestrel__Endpoints__Https__Certificate__Path=/certs/fullchain.cer
      - Kestrel__Endpoints__Https__Certificate__KeyPath=/certs/cert.key
      # DIAGNOSTIC — uncomment to answer "is that device even reaching us, and what did it get
      # back?". appsettings pins Microsoft.AspNetCore to Warning, which hides all request
      # logging. Keep it OFF normally: at Information level HLS playback logs a line per segment.
      # - Logging__LogLevel__Microsoft.AspNetCore=Information
      # Linux server only (see devices: above). CPU x264 everywhere else.
      # - Server__Hls__HardwareAcceleration=Vaapi

    # Reachable by Traefik under this name, on the shared network. Also keeps publishing
    # 5000/5001 above: two front doors with different consumers — the bridge speaks the service
    # name, everything local speaks the port. The bridge being down must not take the backend
    # with it.
    networks:
      - default
      - bifrost

    # Inert unless the bridge is up (Traefik only picks up containers it can see).
    # Everything the backend owns, routed by path so the app and the API share one origin:
    # the API itself, HLS playlists/segments, direct media, subtitles, and the Cast receiver
    # page with its logo. Anything not listed here falls through to the frontend container.
    # Higher priority than the frontend's catch-all so these win regardless of rule length.
    labels:
      - traefik.enable=true
      # Nome único: saga.tdonsoft.com. O antigo flamestream.tdonsoft.com saiu do DNS, então a
      # rota de transição com os dois nomes foi removida.
      #
      # ATENÇÃO: sobre HTTPS isto exige que o defaultCertificate do Traefik
      # (../../Bifrost/dynamic/000-default-cert.yml) cubra saga.tdonsoft.com. Na fase 7b este
      # router ganha `tls.certresolver=le` e aquele arquivo é apagado.
      - traefik.http.routers.saga-api.rule=Host(`${SAGA_HOST:-saga.tdonsoft.com}`)
        && (PathPrefix(`/api`) || PathPrefix(`/stream`) || PathPrefix(`/hls`) || PathPrefix(`/media`)
        || PathPrefix(`/subs`) || PathPrefix(`/receiver`) || PathPrefix(`/stopTranscoding`)
        || Path(`/CozyFlameLogoColor.svg`))
      - traefik.http.routers.saga-api.entrypoints=websecure
      - traefik.http.routers.saga-api.tls=true
      - traefik.http.routers.saga-api.tls.certresolver=le
      - traefik.http.routers.saga-api.priority=100
      - traefik.http.services.saga-api.loadbalancer.server.port=5000

    # TranscodeRegistry allows 5 concurrent jobs, which was sized for AMF offload. On CPU x264
    # five parallel transcodes will saturate the machine and starve WSL2 itself, so give the
    # container a ceiling. Raise/remove once you've seen how it behaves under real load.
    cpus: 8
    mem_limit: 6g

  # ── Frontend: the Angular app, served by nginx ─────────────────────────────────────────────
  # Same hostname as the backend (Traefik routes by path), which is what lets the built bundle
  # resolve the API from window.location.origin instead of a baked-in hostname. Catch-all
  # priority 1 — every backend path is claimed by saga-api at priority 100.
  frontend:
    build:
      context: ../SagaFrontend
    image: saga-frontend
    container_name: saga-frontend
    # The profile name outlived the service it was named after: with Traefik gone from this
    # file, `--profile tls` no longer starts a TLS terminator, it starts the frontend. The name
    # stays because it is what the muscle memory, the .bat files and the Yggdrasil stack all
    # type — and because the frontend is still only reachable over TLS, through the bridge.
    profiles: ["tls"]
    restart: unless-stopped

    environment:
      - TZ=${TZ:-America/Sao_Paulo}

    networks:
      - default
      - bifrost

    labels:
      - traefik.enable=true
      - traefik.http.routers.saga-web.rule=Host(`${SAGA_HOST:-saga.tdonsoft.com}`)
      - traefik.http.routers.saga-web.entrypoints=websecure
      - traefik.http.routers.saga-web.tls.certresolver=le
      - traefik.http.routers.saga-web.tls=true
      - traefik.http.routers.saga-web.priority=1
      - traefik.http.services.saga-web.loadbalancer.server.port=8080

    mem_limit: 128m

volumes:
  # Only used if you switch the /cache mount above to this. Lives on ext4 inside the WSL2 VM,
  # so segment writes are far faster than /mnt/d — at the cost of not sharing state with Windows.
  saga-cache:

networks:
  # The stack's own network, for backend↔frontend. Implicit until `networks:` appeared on the
  # services above — naming one there means naming all of them.
  default:

  # The bridge. Created by hand (`docker network create bifrost`) and owned by no stack, because
  # several hang off it: this one, and the Yggdrasil hub's containers. If it belonged to one of
  # them, tearing that stack down would take the ingress with it.
  bifrost:
    external: true
    name: bifrost
