# Runs the backend under Docker inside the WSL2 Ubuntu-24.04 distro (Docker Engine lives in the
# distro, not Docker Desktop), so all host paths below are WSL paths:
#
#   wsl -d Ubuntu-24.04
#   cd /mnt/c/Users/Thales/source/repos/FlameStream/FlameStreamBackend
#   docker compose up --build                 # plain HTTP on :5000
#   docker compose --profile tls up --build   # + Traefik on :80/:443 with automatic Let's Encrypt
#
# ── ON TLS ───────────────────────────────────────────────────────────────────────────────────
# The backend image speaks plain HTTP and knows nothing about certificates, deliberately. Kestrel
# reads a cert exactly once when it binds HTTPS, so a renewal inside the app container wouldn't
# take effect until a restart; more than one replica would race Let's Encrypt into its rate limits;
# and the DNS API secret has no business being in the app image. TLS is therefore always somebody
# else's job — which also means this identical image drops into k8s untouched, with cert-manager +
# an Ingress doing what the `proxy` service does here. Pick one:
#
#   A. profile "tls" below — Traefik gets and renews the cert itself (DNS-01 via GoDaddy).
#      This is the shape the homelab server should use.
#   B. no proxy, mount a cert Kestrel serves directly — the commented Kestrel__ block on the
#      backend service. Useful on this Windows box, where Posh-ACME already renews that cert.

services:
  backend:
    build:
      context: .
    image: flamestream-backend
    container_name: flamestream-backend
    restart: unless-stopped

    ports:
      - "5000:5000"       # plain HTTP, handy for local debugging
      # HTTPS on the same port the native Windows backend uses, so the frontend, the Cast
      # receiver URL registered at cast.google.com and the TV all keep working unchanged.
      - "5001:5001"

    volumes:
      # Read-only on purpose: the app never writes into LibraryRoot. Everything it derives
      # (HLS segments, scene thumbs, extracted .vtt, mediainfo.json, the SQLite DBs) lands in
      # CacheRoot, which keeps an accidental transcode from ever touching the library.
      - /mnt/d/CozyFlameStream/Media:/media:ro

      # Shared with the Windows run so watch history, My List and already-transcoded titles
      # carry straight over. DON'T run the Windows backend and this container at the same time —
      # two processes writing watchhistory.db/mylist.db over the same 9p mount will corrupt or
      # lock them. If you'd rather isolate the container (and get much faster segment writes on
      # ext4 instead of /mnt/d), swap this line for the named volume at the bottom of the file:
      #   - flamestream-cache:/cache
      - /mnt/d/CozyFlameStream/Cache:/cache

      # Native-app update artifacts served at /api/app/**; published from Windows, so read-only.
      - ./AppReleases:/app-releases:ro

      # The Let's Encrypt cert, still renewed by Posh-ACME on the Windows side. Read-only.
      # Drop this (and the Kestrel__ vars) the day Traefik takes over TLS.
      - /mnt/c/Users/Thales/AppData/Local/Posh-ACME/LE_PROD/3275644921/flamestream.tdonsoft.com:/certs:ro

    # Linux server only — hands the GPU render node to the container so VAAPI encode works.
    # Inert in WSL2: /dev/dri does not exist there, only /dev/dxg. Pair with
    # Server__Hls__HardwareAcceleration=Vaapi below, and group_add for the render group.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render

    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - Kestrel__Endpoints__Https__Url=https://0.0.0.0:5001
      - Kestrel__Endpoints__Https__Certificate__Path=/certs/fullchain.cer
      - Kestrel__Endpoints__Https__Certificate__KeyPath=/certs/cert.key
      # DIAGNOSTIC — uncomment to answer "is that device even reaching us, and what did it get
      # back?". appsettings pins Microsoft.AspNetCore to Warning, which hides all request
      # logging. Keep it OFF normally: at Information level HLS playback logs a line per segment.
      # - Logging__LogLevel__Microsoft.AspNetCore=Information
      # Linux server only (see devices: above). CPU x264 everywhere else.
      # - Server__Hls__HardwareAcceleration=Vaapi

    # Inert unless the tls profile is up (Traefik only picks up containers it can see).
    # Everything the backend owns, routed by path so the app and the API share one origin:
    # the API itself, HLS playlists/segments, direct media, subtitles, and the Cast receiver
    # page with its logo. Anything not listed here falls through to the frontend container.
    # Higher priority than the frontend's catch-all so these win regardless of rule length.
    labels:
      - traefik.enable=true
      - traefik.http.routers.flamestream-api.rule=Host(`${FLAMESTREAM_HOST:-flamestream.tdonsoft.com}`)
        && (PathPrefix(`/api`) || PathPrefix(`/stream`) || PathPrefix(`/hls`) || PathPrefix(`/media`)
        || PathPrefix(`/subs`) || PathPrefix(`/receiver`) || PathPrefix(`/stopTranscoding`)
        || Path(`/CozyFlameLogoColor.svg`))
      - traefik.http.routers.flamestream-api.entrypoints=websecure
      - traefik.http.routers.flamestream-api.tls=true
      - traefik.http.routers.flamestream-api.priority=100
      - traefik.http.services.flamestream-api.loadbalancer.server.port=5000

    # TranscodeRegistry allows 5 concurrent jobs, which was sized for AMF offload. On CPU x264
    # five parallel transcodes will saturate the machine and starve WSL2 itself, so give the
    # container a ceiling. Raise/remove once you've seen how it behaves under real load.
    cpus: 8
    mem_limit: 6g

  # ── TLS terminator + ACME client (profile: tls) ────────────────────────────────────────────
  # Traefik rather than Caddy for one concrete reason: GoDaddy DNS-01 is built into Traefik's
  # bundled lego, while Caddy would need a custom xcaddy build to get the same provider.
  #
  # DNS-01 means issuance needs no inbound port — it works from behind WSL2's NAT. *Serving* on
  # :80/:443 is the part that needs the LAN to reach this host, which on WSL2 means mirrored
  # networking mode or a netsh portproxy. On a real Linux server that problem disappears.
  proxy:
    image: traefik:v3.3
    container_name: flamestream-proxy
    profiles: ["tls"]
    restart: unless-stopped

    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Serves the existing Posh-ACME certificate from a file (docker/traefik-dynamic.yml), so
      # this works today with no ACME account and no GoDaddy credentials.
      - --providers.file.filename=/etc/traefik/dynamic.yml
      #
      # ── LINUX SERVER: let Traefik own the certificate ──────────────────────────────────────
      # Uncomment these four, put the GoDaddy key/secret in .env, add
      #   traefik.http.routers.<name>.tls.certresolver=le
      # to both routers, then drop traefik-dynamic.yml and the /certs mount. That is the version
      # that renews unattended. Do the FIRST run against staging (last line) to prove the
      # credentials before spending production quota — 5 duplicate certs per week.
      # - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.le.acme.dnschallenge=true
      # - --certificatesresolvers.le.acme.dnschallenge.provider=godaddy
      # - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory

    environment:
      # lego's GoDaddy provider — only read once the ACME flags above are enabled. Same API
      # key/secret Posh-ACME uses on Windows (see pluginargs.json in the Posh-ACME order folder).
      # Put them in .env (see .env.example); never inline them here.
      - GODADDY_API_KEY=${GODADDY_API_KEY:-}
      - GODADDY_API_SECRET=${GODADDY_API_SECRET:-}
      - TZ=${TZ:-America/Sao_Paulo}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Read-only, and only so Traefik can watch container labels. If that ever feels like too
      # much authority, swap the docker provider for the file provider and a static route.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      # The cert Posh-ACME renews on Windows. Not needed once Traefik does ACME itself.
      - /mnt/c/Users/Thales/AppData/Local/Posh-ACME/LE_PROD/3275644921/flamestream.tdonsoft.com:/certs:ro
      # acme.json holds the account key and the issued certs — this volume IS the cert store
      # once ACME is enabled. Back it up, or you re-issue on every rebuild.
      - letsencrypt:/letsencrypt

  # ── Frontend: the Angular app, served by nginx ─────────────────────────────────────────────
  # Same hostname as the backend (Traefik routes by path), which is what lets the built bundle
  # resolve the API from window.location.origin instead of a baked-in hostname. Catch-all
  # priority 1 — every backend path is claimed by flamestream-api at priority 100.
  frontend:
    build:
      context: ../FlameStreamFrontend
    image: flamestream-frontend
    container_name: flamestream-frontend
    profiles: ["tls"]
    restart: unless-stopped

    environment:
      - TZ=${TZ:-America/Sao_Paulo}

    labels:
      - traefik.enable=true
      - traefik.http.routers.flamestream-web.rule=Host(`${FLAMESTREAM_HOST:-flamestream.tdonsoft.com}`)
      - traefik.http.routers.flamestream-web.entrypoints=websecure
      - traefik.http.routers.flamestream-web.tls=true
      - traefik.http.routers.flamestream-web.priority=1
      - traefik.http.services.flamestream-web.loadbalancer.server.port=8080

    mem_limit: 128m

volumes:
  # Only used if you switch the /cache mount above to this. Lives on ext4 inside the WSL2 VM,
  # so segment writes are far faster than /mnt/d — at the cost of not sharing state with Windows.
  flamestream-cache:

  # Traefik's ACME state. Survives `docker compose down`; removed by `down -v`.
  letsencrypt:
